name: adapter checks

# The upstream workflows are pinned to self-hosted runners and do not attach results to
# fork pull requests, so the Aster and Ondo adapters get their own no-secrets entry here.
# `scripts/adapter-evidence/native_checks.py` is the single source of the commands; this
# workflow only runs it on a hosted runner and publishes what it wrote.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - crates/adapters/aster/**
      - crates/adapters/ondo/**
      - scripts/adapter-evidence/**
      - .github/workflows/nautilus-adapter-checks.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  push:
    branches:
      - main
    paths:
      - crates/adapters/aster/**
      - crates/adapters/ondo/**
      - scripts/adapter-evidence/**
      - .github/workflows/nautilus-adapter-checks.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

concurrency:
  group: adapter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native checks (aster, ondo)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml, so CI and a local build share the pinned toolchain. The
        # toolchain file names no components, so fmt and clippy are requested here.
        # https://github.com/actions-rust-lang/setup-rust-toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        # https://github.com/actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: adapter-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            adapter-checks-${{ runner.os }}-

      - name: Run evidence tooling regression
        run: python3 scripts/adapter-evidence/test_native_checks.py

      - name: Run native checks and write evidence
        run: python3 scripts/adapter-evidence/native_checks.py --output adapter-native-evidence.json

      - name: Upload evidence
        if: always()
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapter-native-evidence
          path: |
            adapter-native-evidence.json
            adapter-native-evidence-logs
          if-no-files-found: error
