name: adapter checks

# The upstream workflows are pinned to self-hosted runners and do not attach results to
# fork pull requests, so Aster, Ondo and Backpack use this no-secrets entry.
# `scripts/adapter-evidence/native_checks.py` is the single source of the commands; this
# workflow only runs it on a hosted runner and publishes what it wrote.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - crates/adapters/aster/**
      - crates/adapters/ondo/**
      - crates/adapters/backpack/**
      - python/nautilus_trader/adapters/aster/**
      - python/nautilus_trader/adapters/ondo/**
      - python/nautilus_trader/adapters/backpack/**
      - python/tests/unit/adapters/**
      - crates/pyo3/**
      - python/pyproject.toml
      - python/uv.lock
      - python/generate_stubs.py
      - scripts/adapter-evidence/**
      - .github/workflows/nautilus-adapter-checks.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
  push:
    branches:
      - main
    paths:
      - crates/adapters/aster/**
      - crates/adapters/ondo/**
      - crates/adapters/backpack/**
      - python/nautilus_trader/adapters/aster/**
      - python/nautilus_trader/adapters/ondo/**
      - python/nautilus_trader/adapters/backpack/**
      - python/tests/unit/adapters/**
      - crates/pyo3/**
      - python/pyproject.toml
      - python/uv.lock
      - python/generate_stubs.py
      - scripts/adapter-evidence/**
      - .github/workflows/nautilus-adapter-checks.yml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .config/nextest.toml
  workflow_dispatch:

concurrency:
  group: adapter-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native checks (aster, ondo, backpack)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned uv
        # https://github.com/astral-sh/setup-uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.12.6
          enable-cache: false

      - name: Install pinned Python
        run: uv python install 3.12.9

      - name: Set up Rust toolchain
        # Reads rust-toolchain.toml, so CI and a local build share the pinned toolchain. The
        # toolchain file names no components, so fmt and clippy are requested here.
        # https://github.com/actions-rust-lang/setup-rust-toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          override: true
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        # https://github.com/actions/cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: adapter-checks-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            adapter-checks-${{ runner.os }}-

      - name: Get cargo-nextest version
        run: echo "CARGO_NEXTEST_VERSION=$(bash scripts/cargo-tool-version.sh cargo-nextest)" >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        # https://github.com/taiki-e/install-action
        uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Run evidence tooling regression
        run: uv run --no-project --managed-python --python 3.12.9 scripts/adapter-evidence/test_native_checks.py

      - name: Run native checks and write evidence
        run: uv run --no-project --managed-python --python 3.12.9 scripts/adapter-evidence/native_checks.py --output adapter-native-evidence.json

      - name: Upload evidence
        if: always()
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adapter-native-evidence
          path: |
            adapter-native-evidence.json
            adapter-native-evidence-logs
          if-no-files-found: error
